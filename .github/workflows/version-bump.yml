name: Version Bump

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commits or tags)'
        required: false
        default: 'false'
        type: boolean

jobs:
  bump-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch all tags
        run: |
          git fetch --tags --force
          echo "Available tags:"
          git tag --list 'v*' | sort -V | tail -5

      - name: Get current and new version from git tags
        id: version
        run: |
          # Get the latest tag using version sort, default to v1.0.0 if none exist
          CURRENT_TAG=$(git tag --list 'v*' | sort -V | tail -1)
          if [ -z "$CURRENT_TAG" ]; then
            CURRENT_TAG="v1.0.0"
            echo "No existing tags found, starting at $CURRENT_TAG"
          fi

          echo "Current tag: $CURRENT_TAG"

          # Strip 'v' prefix and parse semver
          CURRENT_VERSION=${CURRENT_TAG#v}
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          # Increment patch
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_TAG="v$NEW_VERSION"

          echo "New version: $NEW_VERSION"
          echo "New tag: $NEW_TAG"

          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Find changed timeline files
        id: changed_files
        run: |
          PREV_REF="${{ steps.version.outputs.current_tag }}"

          # Check if the tag exists as a real ref, otherwise use initial commit
          if ! git rev-parse "$PREV_REF" >/dev/null 2>&1; then
            PREV_REF=$(git rev-list --max-parents=0 HEAD)
            echo "Tag not found, using initial commit: $PREV_REF"
          fi

          # Find JSON files in timelines/ that changed since last tag
          CHANGED_FILES=$(git diff --name-only "$PREV_REF" HEAD -- 'timelines/**/*.json' | tr '\n' ' ')
          echo "Changed files: $CHANGED_FILES"
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Update versions in changed config files
        if: steps.changed_files.outputs.has_changes == 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          for file in ${{ steps.changed_files.outputs.changed_files }}; do
            if [ -f "$file" ]; then
              echo "Updating $file to version $NEW_VERSION"

              # Check if file has a Version field
              if jq -e '.Version' "$file" > /dev/null 2>&1; then
                jq --arg ver "$NEW_VERSION" '.Version = $ver' "$file" > "$file.tmp"
                mv "$file.tmp" "$file"
                echo "  Updated Version to $NEW_VERSION"
              else
                echo "  No Version field found, skipping"
              fi
            fi
          done

      - name: Update manifest.json
        if: steps.changed_files.outputs.has_changes == 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          MANIFEST_FILE="manifest.json"

          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "manifest.json not found, creating new one"
            echo "{}" > "$MANIFEST_FILE"
          fi

          for file in ${{ steps.changed_files.outputs.changed_files }}; do
            if [ -f "$file" ]; then
              echo "Updating manifest: $file -> $NEW_VERSION"
              jq --arg path "$file" --arg ver "$NEW_VERSION" '.[$path] = $ver' "$MANIFEST_FILE" > "$MANIFEST_FILE.tmp"
              mv "$MANIFEST_FILE.tmp" "$MANIFEST_FILE"
            fi
          done

          echo "Updated manifest.json:"
          cat "$MANIFEST_FILE"

      - name: Commit version changes
        if: steps.changed_files.outputs.has_changes == 'true' && inputs.dry_run == false
        run: |
          git add timelines/**/*.json manifest.json
          git commit -m "chore: bump versions to ${{ steps.version.outputs.new_tag }}" || echo "No changes to commit"

      - name: Create and push tag
        if: steps.changed_files.outputs.has_changes == 'true' && inputs.dry_run == false
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"

          # Safety check: verify tag doesn't already exist
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $NEW_TAG already exists locally"
            exit 1
          fi

          if git ls-remote --tags origin | grep -q "refs/tags/$NEW_TAG$"; then
            echo "ERROR: Tag $NEW_TAG already exists on remote"
            exit 1
          fi

          git push origin HEAD
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "Created and pushed tag: $NEW_TAG"

      - name: Summary
        run: |
          echo "## Version Bump Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.changed_files.outputs.has_changes }}" == "true" ]; then
            echo "### Changed Files" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.changed_files.outputs.changed_files }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Version: \`${{ steps.version.outputs.new_version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "### Tag: \`${{ steps.version.outputs.new_tag }}\`" >> $GITHUB_STEP_SUMMARY

            if [ "${{ inputs.dry_run }}" == "true" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "> **Note:** This was a dry run. No commits or tags were created." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No timeline files changed since last tag." >> $GITHUB_STEP_SUMMARY
          fi
